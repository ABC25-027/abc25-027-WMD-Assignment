<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart | MONOCHROME</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body class="bg-black text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MONOCHROME</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="men.html">MEN</a></li>
                    <li class="nav-item"><a class="nav-link" href="women.html">WOMEN</a></li>
                    <li class="nav-item"><a class="nav-link" href="accessories.html">ACCESSORIES</a></li>
                    <li class="nav-item"><a class="nav-link" href="runways.html">RUNWAYS</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">CONTACT</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="fw-bold mb-4">🛒 Your Cart</h2>

        <div class="cart-box p-4 bg-dark rounded">
            <ul id="cart-items" class="list-group mb-3">
                <!-- Items will be injected here -->
            </ul>

            <h4 class="mt-3">Total: $<span id="total">0</span></h4>

            <div class="d-flex gap-2">
                <button class="btn btn-outline-danger mt-3" onclick="clearCart()">Clear Cart</button>
                <a href="checkout.html" class="btn btn-light mt-3">Proceed to Payment</a>
            </div>
        </div>
    </div>
    

    <script>
        // Initialize cart from localStorage
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function renderCart() {
            const list = document.getElementById("cart-items");
            const totalElement = document.getElementById("total");
            
            // Clear current list and reset total
            list.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                list.innerHTML = `<li class="list-group-item bg-dark text-white border-secondary text-center">Your cart is empty.</li>`;
                totalElement.textContent = "0";
                return;
            }

            cart.forEach((item, index) => {
                let price = Number(item.price) || 0;
                let qty = Number(item.qty) || 1;
                let itemTotal = price * qty;
                total += itemTotal;

                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center bg-dark text-white border-secondary";

                li.innerHTML = `
                    <div>
                        <strong>${item.name}</strong><br>
                        <small class="text-secondary">$${price} × ${qty}</small>
                    </div>
                    <div class="text-end">
                        <div>$${itemTotal}</div>
                        <button class="btn btn-sm btn-danger mt-1" onclick="removeItem(${index})">
                            Remove
                        </button>
                    </div>
                `;
                list.appendChild(li);
            });

            totalElement.textContent = total.toFixed(2);
            
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            renderCart();
        }

        function clearCart() {
            if(confirm("Are you sure you want to clear your cart?")) {
                cart = [];
                localStorage.setItem("cart", JSON.stringify(cart));
                renderCart();
            }
        }

        // Initial render on page load
        renderCart();
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
