<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | SWAADI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div class="container mt-3">
    <a href="index.html" class="btn-back">← CONTINUE SHOPPING</a>
</div>

<div class="container pb-5">
    <div class="checkout-grid">
        <!-- LEFT: FORM -->
        <div class="action-column">
            <div class="section-title">Shipping Details</div>
            <div class="row g-2"> <!-- g-2 makes gutters smaller -->
                <div class="col-md-6 mb-2">
                    <input type="text" id="custName" class="form-control" placeholder="Full Name">
                </div>
                <div class="col-md-6 mb-2">
                    <input type="email" id="custEmail" class="form-control" placeholder="Email Address">
                </div>
                <div class="col-12 mb-2">
                    <input type="text" id="address" class="form-control" placeholder="Street Address">
                </div>
                <div class="col-md-5 mb-2">
                    <input type="text" id="city" class="form-control" placeholder="City">
                </div>
                <div class="col-md-4 mb-2">
                    <input type="text" id="state" class="form-control" placeholder="State">
                </div>
                <div class="col-md-3 mb-2">
                    <input type="text" id="zip" class="form-control" placeholder="Zip">
                </div>
            </div>

            <div class="section-title mt-4">Payment</div>
            <div class="payment-selection">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="payMethod" id="card" checked onclick="togglePayment()">
                    <label class="form-check-label" for="card">Credit Card</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="payMethod" id="paypal" onclick="togglePayment()">
                    <label class="form-check-label" for="paypal">PayPal</label>
                </div>
            </div>

            <div id="card-fields" class="row g-2">
                <div class="col-12 mb-2">
                    <input type="text" class="form-control" placeholder="Card Number">
                </div>
                <div class="col-md-6 mb-2">
                    <input type="text" class="form-control" placeholder="MM/YY" oninput="formatDate(this)">
                </div>
                <div class="col-md-6 mb-2">
                    <input type="text" class="form-control" placeholder="CVV">
                </div>
            </div>
        </div>

        <!-- RIGHT: SUMMARY -->
        <div class="summary-column">
            <div class="summary-box">
                <h6 class="fw-bold mb-3">ORDER SUMMARY</h6>
                <div id="order-items-list" style="max-height: 150px; overflow-y: auto;">
                    <!-- Scrollable mini list if there are too many items -->
                </div>
                
                <div class="mt-3 pt-3 border-top border-secondary">
                    <div class="d-flex justify-content-between small">
                        <span class="text-secondary">Subtotal</span>
                        <span id="subtotal-val">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold mt-2">
                        <span>TOTAL</span>
                        <span>$<span id="final-total">0.00</span></span>
                    </div>
                </div>

                <button class="btn-checkout" onclick="completePurchase()">PLACE ORDER</button>
                <!-- Inside your summary-box div, under the Place Order button -->
<div class="text-center mt-3">
    <a href="cart.html" class="btn-back-secondary">RETURN TO CART</a>
</div>
            </div>
        </div>
    </div>
</div>
<script>
console.log("Current Session Email:", localStorage.getItem('userEmail'));
console.log("Storage Key Being Used:", localStorage.getItem('userEmail') + "_details");
function displayOrder() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const list = document.getElementById("order-items-list");
    const totalSpan = document.getElementById("final-total");
    
    let total = 0;
    list.innerHTML = "";

    if (cart.length === 0) {
        list.innerHTML = "<li class='list-group-item px-0'>Your cart is empty</li>";
        return;
    }

    cart.forEach(item => {
        let p = parseFloat(item.price) || 0;
        let q = parseInt(item.qty) || 1;
        let sub = p * q;
        total += sub;

        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between px-0";
        li.innerHTML = `<span>${item.name} (x${q})</span> <span>$${sub.toFixed(2)}</span>`;
        list.appendChild(li);
    });

    totalSpan.textContent = total.toFixed(2);
}

function formatDate(input) {
    // Remove any non-numerical characters except the slash
    let value = input.value.replace(/\D/g, '');
    
    // If the user has typed 2 or more numbers, insert the slash
    if (value.length > 2) {
        input.value = value.substring(0, 2) + '/' + value.substring(2, 4);
    } else {
        input.value = value;
    }
}
// 2. Handle the "Place Order" button
function completePurchase() {
    // A. Identify the active user
    const activeEmail = localStorage.getItem('userEmail');
    const isLoggedIn = localStorage.getItem('isLoggedIn');

    if (!isLoggedIn || !activeEmail) {
        alert("You must be logged in to complete a purchase.");
        window.location.href = "login.html";
        return;
    }

    const nameInput = document.getElementById("custName");
    const addrInput = document.getElementById("address");
    const payMethodElement = document.querySelector('input[name="payMethod"]:checked');
    const cart = JSON.parse(localStorage.getItem('cart')) || [];

    // Validation
    if (!nameInput.value || !addrInput.value) {
        alert("Please fill in your shipping details.");
        return;
    }
    if (!payMethodElement) {
        alert("Please select a payment method.");
        return;
    }
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    const generatedOrderID = "SWAADI-" + Math.floor(Math.random() * 900000 + 100000);
    const payMethod = payMethodElement.value;

    // B. Link to the specific Account Storage
    const userKey = activeEmail + "_details";
    
    // Load existing profile details so we don't erase them
    let userDetails = JSON.parse(localStorage.getItem(userKey)) || {};

    // C. Update the user details object with the new order info
    userDetails.name = nameInput.value;
    userDetails.address = addrInput.value;
    userDetails.orderID = generatedOrderID;
    userDetails.paymentMethod = payMethod.toUpperCase();
    userDetails.date = new Date().toLocaleDateString();
    
    // Also store the items in this specific user's folder
    userDetails.lastOrderItems = cart;

    // D. Save it all back to the email-specific key
    localStorage.setItem(userKey, JSON.stringify(userDetails));

    // Cleanup and Redirect
    localStorage.removeItem('cart');
    window.location.href = "receipt.html";
}

window.onload = displayOrder;
</script>
</body>
</html>
