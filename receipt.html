<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt | SWAADI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff; color: #000; font-family: 'Courier New', Courier, monospace; }
        .receipt-container { max-width: 600px; margin: 50px auto; border: 1px solid #000; padding: 40px; }
        .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 20px; margin-bottom: 30px; }
        .line-item { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .total-section { border-top: 2px solid #000; margin-top: 20px; padding-top: 10px; font-weight: bold; }
        .footer { text-align: center; margin-top: 40px; font-size: 0.9rem; }
        @media print {
            .no-print { display: none; }
            .receipt-container { border: none; margin: 0; }
        }
    </style>
</head>
<body>

<div class="container no-print mt-3 text-center">
    <button class="btn btn-dark" onclick="window.print()">Print Receipt</button>
    <a href="index.html" class="btn btn-outline-dark">Return Home</a>
</div>

<div class="receipt-container">
    <div class="header">
        <h1 class="fw-bold">SWAADI</h1>
        <p>Official Purchase Receipt</p>
        <p id="receipt-date"></p>
        <p>Order ID: <span id="order-id"></span></p>
    </div>

    <div class="mb-4">
        <strong>Billed To:</strong><br>
        <span id="receipt-name"></span><br>
        <span id="receipt-address"></span>
    </div>

    <div id="receipt-items">
        <!-- Items injected here -->
    </div>

    <div class="total-section">
        <div class="line-item">
            <span>TOTAL PAID</span>
            <span id="receipt-total"></span>
        </div>
    </div>

    <div class="footer">
        <p>Thank you for choosing SWAADI.</p>0
        <p>www.swaadi-store.com</p>
    </div>
</div>

<script>
    console.log("Current Session Email:", localStorage.getItem('userEmail'));
console.log("Storage Key Being Used:", localStorage.getItem('userEmail') + "_details");  
   function generateReceipt() {
    // 1. Identify the active user to find their specific folder
    const activeEmail = localStorage.getItem('userEmail');
    const userKey = activeEmail + "_details";
    
    // 2. Pull the consolidated data object
    const details = JSON.parse(localStorage.getItem(userKey));

    const list = document.getElementById("receipt-items");
    const totalSpan = document.getElementById("receipt-total");
    const orderIdSpan = document.getElementById("order-id");

    // 3. Check if we actually have data for this specific user
    if (!details || !details.lastOrderItems || details.lastOrderItems.length === 0) {
        document.body.innerHTML = `
            <div class='text-center mt-5'>
                <h1>No Receipt Found</h1>
                <p>Please log in or check your account history.</p>
                <a href="index.html" class="btn btn-dark">Return Home</a>
            </div>`;
        return;
    }

    // 4. Extract order items from the user details object
    const cart = details.lastOrderItems;

    // DISPLAY THE SAVED ORDER ID
    if (orderIdSpan) {
        orderIdSpan.innerText = details.orderID || "N/A";
    }

    // Update the UI with user-specific data
    document.getElementById('receipt-name').innerText = details.name || "N/A";
    document.getElementById('receipt-address').innerText = details.address || "N/A";
    document.getElementById('receipt-date').innerText = details.date || "";

    let finalTotal = 0;
    list.innerHTML = "";

    cart.forEach(item => {
        let p = parseFloat(item.price) || 0;
        let q = parseInt(item.qty) || 1;
        let sub = p * q;
        finalTotal += sub;

        const div = document.createElement('div');
        div.className = 'd-flex justify-content-between mb-2';
        div.innerHTML = `<span>${item.name} (x${q})</span> <span>$${sub.toFixed(2)}</span>`;
        list.appendChild(div);
    });

    totalSpan.innerText = "$" + finalTotal.toFixed(2);
}

window.onload = generateReceipt;
</script>
</body>
</html>
