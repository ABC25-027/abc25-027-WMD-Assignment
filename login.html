<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MONOCHROME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Reusing your high-visibility styles -->
    <link rel="stylesheet" href="stylesheet.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: #0b0b0b;
            border: 2px solid #333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="login-container">
        <h2 class="section-title text-center">Sign In</h2>
        
        <div class="mb-4">
            <label class="small text-secondary mb-2">EMAIL ADDRESS</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com">
        </div>
        
        <div class="mb-4">
            <label class="small text-secondary mb-2">PASSWORD</label>
            <input type="password" id="loginPass" class="form-control" placeholder="••••••••">
        </div>

        <button class="btn-checkout mb-3" onclick="handleLogin()">LOGIN</button>
        
        <div class="text-center">
            <a href="index.html" class="btn-back-secondary">Return to Shop</a>
        </div>
    </div>
</div>


<script>
    function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;

        if (email && pass) {
            // For a prototype, we save the "Logged In" status
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userEmail', email);
            
            // Redirect to the account page
            window.location.href = "account.html";
        } else {
            alert("Please enter both email and password.");
        }
    }
</script>
</body>
</html>
